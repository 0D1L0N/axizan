name: CI

# La suite ne servait a rien tant que personne ne la lancait : 38 tests verts
# qu'aucun automatisme n'executait. Ce workflow les rend contraignants.

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # pdo_sqlite : la suite tourne entierement en base memoire, jamais
          # sur la base de developpement (voir tests/TestCase.php).
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lancer la suite
        run: ./vendor/bin/phpunit

  frontend:
    name: Front — build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      # Le build attrape ce que le lint laisse passer : import cassé, page qui
      # ne compile pas, frontiere Suspense manquante.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
