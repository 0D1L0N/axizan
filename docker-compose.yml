services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: axizan-postgres
    environment:
      POSTGRES_DB: axizan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: axizan-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axizan-laravel
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=axizan
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - ./backend:/app
      - /app/vendor
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0

  # Ouvrier de file d'attente.
  #
  # Sans lui, QUEUE_CONNECTION avait beau etre configure, aucun travail mis en
  # file n'etait jamais execute — et les mails partaient en synchrone, un
  # serveur SMTP lent bloquant alors la commande du client.
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axizan-queue
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=axizan
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - ./backend:/app
      - /app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # --tries=3 : un envoi qui echoue est retente, pas perdu en silence.
    command: php artisan queue:work redis --tries=3 --max-time=3600 --sleep=2

  # Ordonnanceur : sans lui, routes/console.php ne s'execute jamais
  # (rappels de paniers recurrents, purge des jetons expires).
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axizan-scheduler
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=axizan
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - ./backend:/app
      - /app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: php artisan schedule:work

  # Next.js Frontend
  nextjs:
    image: node:20-alpine
    container_name: axizan-nextjs
    working_dir: /app
    environment:
      # Surchargeable par API_URL dans le .env a la racine : « localhost »
      # designe le telephone quand on teste depuis un mobile, pas le PC.
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:8000/api/v1}
      # Le montage Windows ne propage pas les evenements inotify : sans polling,
      # le serveur de dev ne voit aucune modification et il faut redemarrer le
      # conteneur a chaque edition.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"

  # Mailpit (Mail Testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: axizan-mailpit
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP

volumes:
  postgres_data:

networks:
  default:
    name: axizan-network
